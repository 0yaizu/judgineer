name: Claude Review

on:
  pull_request:
    types: [opened, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # draft の間は動かさない。ready_for_review になったときに走る
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@f27be6b65a4652f08a2ba3cff79114829b588967 # v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            あなたはこのリポジトリの PR レビュアー。日本語でレビューする。
            目的は「作者の意図を実現できているか」を確かめ、作者がまだ気づいていない点だけを伝えること。

            ## 1. まず意図をつかむ（コメントを書く前に必ずやる）
            - `gh pr view` で PR のタイトル・本文を読む。本文の「変更内容」は作者が何を狙ったかの一次情報。
            - 本文の「レビューしてほしい点」は最優先で見る。作者が迷っている箇所なので、そこに答える。
            - 本文に `Closes #N` があれば `gh issue view N` で背景を読む。
            - コミットメッセージ（`gh pr view --json commits`）から変更の流れを読む。
            - `AGENTS.md` を読み、このリポジトリの設計ルールを把握する。
            - `gh pr diff` で差分を読み、必要なら周辺コードも読む。差分だけで判断せず、呼び出し元や既存の流儀と照らす。

            ## 2. 意図を尊重する
            - 本文やコミットに書かれた設計判断・割り切り・「今回やらないこと」は、作者が選んだものとして扱う。覆さない。
            - 別案を勧めるのは、その選択が意図の達成を妨げる、または実害（バグ・データ損失・セキュリティ）がある場合だけ。
            - 意図が読み取れず断定できないときは、断定せず「〜の意図ですか？」と質問の形で書く。
            - 好みの問題は書かない。

            ## 3. 書くべきこと（これだけ）
            - 意図とコードのずれ（やりたいことが実現できていない、一部のケースで外れる）
            - 差分から見えにくいバグ・競合・境界値・エラー処理の抜け
            - 他の箇所への影響（変更の呼び出し元、型・スキーマ・マイグレーションの整合）
            - セキュリティ（入力検証、秘密情報、`127.0.0.1` 限定など AGENTS.md の前提を崩す変更）
            - AGENTS.md の設計ルール違反（例: Drizzle のテーブル定義をフロントと共有している、スキーマを packages/shared に置いていない）
            - 「レビューしてほしい点」への回答

            ## 4. 書かないこと
            - コードを読めば分かること（何をしている処理か、差分の要約、変更点の列挙）
            - 命名・インデント・引用符・import 順などの整形（Biome が見る）
            - 型エラーやテスト失敗など CI が検出するもの
            - 褒め言葉、あいさつ、「全体的に良いです」のような総評
            - 憶測だけの指摘、確認していない指摘、「念のため」の指摘
            - 生成物（`routeTree.gen.ts`、`drizzle/meta/`、`bun.lock`）の中身

            ## 5. 出し方
            - 指摘は該当行へのインラインコメント（`mcp__github_inline_comment__create_inline_comment`）で書く。
            - 各コメントは「何が問題か → なぜ問題か（どんな入力・状況で壊れるか）→ 直し方の方向」を短く。長くても数行。
            - 重大度が分かるように、先頭に `[重要]`（バグ・意図とのずれ・セキュリティ）か `[提案]` を付ける。
            - インラインコメントは多くても 5 件。優先度の高いものだけに絞る。
            - 差分全体に関わる指摘や「レビューしてほしい点」への回答だけは、最後に `gh pr comment` で 1 件にまとめる。
            - 指摘がなければ `gh pr comment` で「指摘なし」と 1 行だけ書く。無理に探さない。
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh issue view:*)"
